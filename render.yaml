# Render Blueprint — 정적 사이트 배포
#
# 사용법
#   1. 이 저장소를 GitHub에 올린다
#   2. Render 대시보드 → New + → Blueprint → 저장소 선택
#   3. 자동으로 아래 설정대로 만들어진다
#
# 정적 사이트는 무료 플랜에서 잠들지 않고, 인스턴스 시간 제한도 없다.
# 빌드 과정이 없으므로 buildCommand는 비워 둔다.

services:
  - type: web
    name: tarot
    runtime: static
    staticPublishPath: .
    buildCommand: ''
    pullRequestPreviewsEnabled: false

    headers:
      # 정적 자산은 길게 캐시한다 (카드 이미지가 대부분)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /js/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    routes:
      # SPA는 아니지만, 알 수 없는 경로는 메인으로 보낸다
      - type: rewrite
        source: /*
        destination: /index.html

